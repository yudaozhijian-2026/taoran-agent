agent_code: DSM-TAORAN-SCORING-AGENT
version: 0.14.1
capabilities:
  - code: configure_tenant_connections
    mode: administrative
    side_effect: runtime_configuration_only
    registry_version: 1
    web_console: /admin/tenants
    authorized_app_form_discovery: true
    automatic_tenant_id: true
    manual_field_confirmation: true
    field_recheck: true
    existing_tenant_form_reselection: true
    unique_form_tenant_binding: true
    post_onboarding_deployment_guide: true
    step_by_step_jiandaoyun_tutorial: true
    runtime_deployment_status_dashboard: true
    secrets_returned_by_api: one_time_on_generation_only
  - code: precheck_visit_record
    mode: synchronous
    target_latency_seconds: 12
    side_effect: advisory_only
    button_behavior: one_click_three_feedbacks
    feedback_outputs:
      rule:
        engine: TAORAN-PRECHECK-KB-V2
        model_calls: false
      model:
        engine: TAORAN-PRECHECK-PURE-AI-V1
        knowledge_runtime: none
        model_calls: true
      knowledge:
        engine: TAORAN-PRECHECK-KNOWLEDGE-AI-V1
        knowledge_runtime: live_dsm_knowledge_api
        local_snapshot_fallback: false
        model_calls: true
  - code: sync_taoran_knowledge
    mode: administrative
    side_effect: reviewed_snapshot_only
  - code: evaluate_visit_effectiveness
    mode: asynchronous
    side_effect: audit_only
    configured_model: glm-5.2
    model_total_budget_seconds: 45
    max_format_retries: 1
  - code: adapt_jiandaoyun_visit
    mode: synchronous
    side_effect: none
  - code: writeback_jiandaoyun_evaluation
    mode: asynchronous
    side_effect: configured_fields_only
  - code: expose_q40_period_facts
    mode: synchronous
    enabled_by_default: false
    side_effect: read_only
  - code: batch_backfill_q40_facts
    mode: asynchronous
    enabled_by_default: false
    side_effect: taoran_audit_only
governance:
  tenant_isolation: required
  idempotency: required
  input_snapshot_hash: required
  evidence_traceability: required
  ai_may_modify_facts: false
