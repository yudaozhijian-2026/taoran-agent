<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TAORAN 客户接入管理</title>
  <link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body>
  <header class="topbar">
    <div>
      <span class="brand-mark">T</span>
      <span class="brand">TAORAN 客户接入管理</span>
    </div>
    <span id="serverStatus" class="status muted">未连接</span>
  </header>

  <main class="layout">
    <section id="loginPanel" class="card login-card">
      <p class="eyebrow">管理员验证</p>
      <h1>先连接 TAORAN 服务</h1>
      <p class="hint">管理员 Key 仅保留在当前页面内存中，不会存入浏览器。</p>
      <form id="loginForm" class="stack">
        <label>
          <span>管理员 Key</span>
          <input id="adminKey" type="password" autocomplete="off" required placeholder="请输入独立管理员 Key">
        </label>
        <button type="submit" class="primary">验证并进入</button>
      </form>
      <div id="loginMessage" class="message hidden" role="alert"></div>
    </section>

    <section id="workspace" class="workspace hidden">
      <div class="page-heading">
        <div>
          <p class="eyebrow">多客户配置</p>
          <h1>新客户一键接入</h1>
          <p class="hint">先连接简道云，再从已授权的应用和表单中选择，其他配置由系统完成。</p>
        </div>
        <button id="logoutButton" type="button" class="ghost">退出</button>
      </div>

      <nav class="page-tabs" aria-label="管理页面">
        <button id="showOnboardingButton" type="button" class="page-tab active">客户接入配置</button>
        <button id="showRuntimeButton" type="button" class="page-tab">部署完成 / 运行状态</button>
      </nav>

      <div id="onboardingView" class="view-panel">
        <div class="grid">
        <section class="card form-card">
          <div class="section-title">
            <h2>连接简道云</h2>
            <span class="step">1</span>
          </div>
          <form id="tenantForm" class="stack onboarding-form">
            <label id="apiKeyField" class="full">
              <span>简道云 API Key <b>*</b></span>
              <input name="jiandaoyun_api_key" type="password" autocomplete="new-password" required placeholder="粘贴该客户的独立 API Key">
              <small>系统只读取该Key已授权的应用和表单，不会在浏览器保存</small>
            </label>
            <button id="connectButton" type="button" class="primary full">连接简道云</button>
            <div id="connectionMessage" class="message hidden full" role="alert"></div>

            <div id="formConfiguration" class="configuration-panel hidden full">
              <div class="section-title compact-title">
                <h2>选择授权表单</h2>
                <span class="step">2</span>
              </div>
              <p id="selectionModeMessage" class="automation-note hidden"></p>
              <div class="form-grid configuration-fields">
                <label class="full">
                  <span>客户名称 <b>*</b></span>
                  <input name="display_name" required placeholder="例：成都某医疗公司">
                </label>
                <label>
                  <span>已授权应用 <b>*</b></span>
                  <select id="applicationSelect" name="application_id" required></select>
                </label>
                <label>
                  <span>拜访记录表单 <b>*</b></span>
                  <select id="formSelect" name="entry_id" required></select>
                </label>
              </div>
              <p class="automation-note">客户编号、应用ID、表单ID、表单名称、字段映射和接入密钥将自动生成。</p>
              <div class="configuration-actions">
                <button id="saveButton" type="submit" class="primary">完成配置</button>
                <button id="cancelSelectionButton" type="button" class="ghost hidden">取消重新选择</button>
              </div>
            </div>
          </form>
          <div id="saveMessage" class="message hidden" role="alert"></div>
        </section>

        <aside class="card result-card">
          <div class="section-title">
            <h2>配置结果</h2>
            <span class="step">3</span>
          </div>
          <div id="emptyResult" class="empty">提交后，这里会显示连接、字段匹配和启用结果。</div>
          <div id="resultContent" class="hidden"></div>
        </aside>
        </div>

        <section class="card tenant-list-card">
          <div class="section-title list-heading">
            <div>
              <h2>已接入客户</h2>
              <p class="hint">已隐藏 API Key 和签名密钥。</p>
            </div>
            <button id="refreshButton" type="button" class="ghost">刷新</button>
          </div>
          <div id="tenantList" class="tenant-list"></div>
        </section>
      </div>

      <section id="runtimeView" class="view-panel hidden">
        <div class="runtime-heading">
          <div>
            <p class="eyebrow">真实运行证据</p>
            <h2>部署完成 / 运行状态</h2>
            <p class="hint">根据客户配置、AI检测、提交后评价和简道云回写记录自动判断。</p>
          </div>
          <button id="refreshRuntimeButton" type="button" class="ghost">刷新运行状态</button>
        </div>
        <div id="runtimeMessage" class="message hidden" role="alert"></div>
        <div id="systemRuntimeCards" class="runtime-system-grid"></div>
        <div id="tenantRuntimeList" class="runtime-tenant-list"></div>
      </section>
    </section>
  </main>
  <script src="/admin/assets/admin.js" defer></script>
</body>
</html>
