[project]
name = "dsm-taoran-agent"
version = "0.13.0"
description = "DSM Q33/Q34各50分、总分100的独立TAORAN拜访评分Agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116",
  "httpx>=0.28",
  "pydantic-settings>=2.10",
  "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "ruff>=0.12",
]

[project.scripts]
taoran-agent = "taoran_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taoran_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/taoran_agent/data/taoran_rules_v1.json" = "taoran_agent/data/taoran_rules_v1.json"
"src/taoran_agent/data/jiandaoyun_mapping_example.json" = "taoran_agent/data/jiandaoyun_mapping_example.json"
"src/taoran_agent/data/taoran_knowledge_snapshot_v1.json" = "taoran_agent/data/taoran_knowledge_snapshot_v1.json"
"src/taoran_agent/admin_ui/index.html" = "taoran_agent/admin_ui/index.html"
"src/taoran_agent/admin_ui/admin.css" = "taoran_agent/admin_ui/admin.css"
"src/taoran_agent/admin_ui/admin.js" = "taoran_agent/admin_ui/admin.js"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
