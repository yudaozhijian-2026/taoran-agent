<VirtualHost *:443>
    ServerName taoran-test.yudaozhijian.top
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/taoran-test.yudaozhijian.top/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/taoran-test.yudaozhijian.top/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    LimitRequestBody 1048576
    ProxyPass /quick-check/interactive http://127.0.0.1:8031/quick-check/interactive connectiontimeout=3 timeout=30
    ProxyPassReverse /quick-check/interactive http://127.0.0.1:8031/quick-check/interactive
    ProxyPass /api/v1/ http://127.0.0.1:8031/api/v1/ connectiontimeout=3 timeout=90
    ProxyPassReverse /api/v1/ http://127.0.0.1:8031/api/v1/
    ProxyPass /health http://127.0.0.1:8031/health connectiontimeout=3 timeout=15
    ProxyPassReverse /health http://127.0.0.1:8031/health
    <LocationMatch "^/(admin|docs|redoc|openapi|api/v1/integrations/q40)">
        Require all denied
    </LocationMatch>
    RedirectMatch 302 "^/$" "https://taoran-test.yudaozhijian.top/health"
    ErrorLog "/TAORAN agent/isolated-submit-test-20260916/logs/apache-error.log"
    CustomLog "/TAORAN agent/isolated-submit-test-20260916/logs/apache-access.log" "%t %m %U %>s %b"
</VirtualHost>
