# TAORAN only: serve ACME verification, never expose the app over plain HTTP.
<VirtualHost *:80>
    ServerName taoran.yudaozhijian.top
    DocumentRoot "/TAORAN agent/acme"
    <Directory "/TAORAN agent/acme">
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all denied
    </Directory>
    Alias /.well-known/acme-challenge/ "/TAORAN agent/acme/.well-known/acme-challenge/"
    <Directory "/TAORAN agent/acme/.well-known/acme-challenge">
        Require all granted
        ForceType text/plain
    </Directory>
    ErrorLog "/TAORAN agent/logs/apache-error.log"
    CustomLog "/TAORAN agent/logs/apache-access.log" "%t %m %U %>s %b %D"
</VirtualHost>
