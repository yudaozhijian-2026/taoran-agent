<VirtualHost *:80>
    ServerName taoran-test.yudaozhijian.top
    DocumentRoot /var/www/taoran-submit-test-acme
    <Directory /var/www/taoran-submit-test-acme>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
    </Directory>
    RedirectMatch 301 "^/(?!\.well-known/acme-challenge/)(.*)$" "https://taoran-test.yudaozhijian.top/$1"
    ErrorLog "/TAORAN agent/isolated-submit-test-20260916/logs/apache-error.log"
    CustomLog "/TAORAN agent/isolated-submit-test-20260916/logs/apache-access.log" "%t %m %U %>s %b"
</VirtualHost>
