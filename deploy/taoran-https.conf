# Only this exact hostname routes to the isolated TAORAN service.
<VirtualHost *:80>
    ServerName taoran.yudaozhijian.top
    DocumentRoot "/TAORAN agent/acme"
    <Directory "/TAORAN agent/acme">
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all denied
    </Directory>
    Alias /.well-known/acme-challenge/ "/TAORAN agent/acme/.well-known/acme-challenge/"
    <Directory "/TAORAN agent/acme/.well-known/acme-challenge">
        Require all granted
        ForceType text/plain
    </Directory>
    RedirectMatch 301 "^/(?!\.well-known/acme-challenge/)(.*)$" "https://taoran.yudaozhijian.top/$1"
    ErrorLog "/TAORAN agent/logs/apache-error.log"
    CustomLog "/TAORAN agent/logs/apache-access.log" "%t %m %U %>s %b %D"
</VirtualHost>

<VirtualHost *:443>
    ServerName taoran.yudaozhijian.top
    DocumentRoot "/TAORAN agent/acme"
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/taoran.yudaozhijian.top/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/taoran.yudaozhijian.top/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 30
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Cache-Control "no-store"
    LimitRequestBody 1048576

    ProxyPass /api/v1/ http://127.0.0.1:8030/api/v1/ connectiontimeout=3 timeout=30
    ProxyPassReverse /api/v1/ http://127.0.0.1:8030/api/v1/
    ProxyPass /admin/ http://127.0.0.1:8030/admin/ connectiontimeout=3 timeout=30
    ProxyPassReverse /admin/ http://127.0.0.1:8030/admin/
    ProxyPass /health http://127.0.0.1:8030/health connectiontimeout=3 timeout=15
    ProxyPassReverse /health http://127.0.0.1:8030/health
    RedirectMatch 302 "^/$" "https://taoran.yudaozhijian.top/health"

    <Directory "/TAORAN agent/acme">
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all denied
    </Directory>
    <LocationMatch "^/(docs(?:/|$)|redoc(?:/|$)|openapi\.json$|api/v1/integrations/q40(?:/|$))">
        Require all denied
    </LocationMatch>
    ErrorLog "/TAORAN agent/logs/apache-error.log"
    # Never log query signatures, authorization headers, or request bodies.
    CustomLog "/TAORAN agent/logs/apache-access.log" "%t %m %U %>s %b %D"
</VirtualHost>
